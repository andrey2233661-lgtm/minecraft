<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виселица</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2378c05a'/><rect x='3' y='5' width='3' height='3' fill='%23000'/><rect x='10' y='5' width='3' height='3' fill='%23000'/><rect x='4' y='10' width='2' height='2' fill='%23000'/><rect x='10' y='10' width='2' height='2' fill='%23000'/><rect x='6' y='11' width='4' height='4' fill='%23000'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="explosion" class="explosion"></div>

<h1>Виселица</h1>
<div class="subtitle">угадай слово по буквам</div>

<div class="stats">
    <div class="stat">Побед <b id="wins">0</b></div>
    <div class="stat">Игр <b id="games">0</b></div>
    <div class="stat">Ошибок <b id="mistakes">0</b>/6</div>
</div>

<div class="stage">
    <div class="hangman-box">
        <svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
            <line class="gallows" x1="20" y1="200" x2="120" y2="200"/>
            <line class="gallows" x1="70" y1="200" x2="70" y2="20"/>
            <line class="gallows" x1="70" y1="20" x2="150" y2="20"/>
            <line class="gallows" x1="150" y1="20" x2="150" y2="45"/>

            <circle class="part" data-part="1" cx="150" cy="65" r="20"/>
            <line   class="part" data-part="2" x1="150" y1="85" x2="150" y2="140"/>
            <line   class="part" data-part="3" x1="150" y1="100" x2="125" y2="120"/>
            <line   class="part" data-part="4" x1="150" y1="100" x2="175" y2="120"/>
            <line   class="part" data-part="5" x1="150" y1="140" x2="130" y2="175"/>
            <line   class="part" data-part="6" x1="150" y1="140" x2="170" y2="175"/>
        </svg>
    </div>

    <div class="info">
        <div class="category" id="category"></div>
        <div class="word" id="word"></div>
        <div class="status" id="status"></div>
    </div>
</div>

<div class="letters" id="letters"></div>

<button class="restart" onclick="newGame()">Новая игра</button>

<script src="words.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
